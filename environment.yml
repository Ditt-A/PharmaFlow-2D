name: pharmaflow-2d
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy>=1.26,<2.0
      - scipy>=1.12,<2
      - pandas>=2.2,<3
      - matplotlib>=3.8,<4
      # 1.7.4 requires GLIBC_2.32; the managed Ubuntu 20.04 container has 2.31.
      - taichi==1.7.3
      - numbers-parser==4.22.2
      - pillow>=10,<13
      - requests>=2.31,<3
      - h5py>=3.10,<4
      - pyarrow>=19,<20
      - pyyaml>=6,<7
      - tqdm>=4.66,<5
      - jupyterlab>=4,<5
      - ipykernel>=6,<7
      - pytest>=8,<10
