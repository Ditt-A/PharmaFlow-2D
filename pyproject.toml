[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaflow-2d"
version = "0.0.1"
description = "Research scaffold for 2D DEM granular hopper flow and future AI-based clogging diagnostics"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "taichi>=1.7,<1.9",
  "requests>=2.31,<3",
  "h5py>=3.10,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
