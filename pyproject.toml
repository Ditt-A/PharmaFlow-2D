[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaflow-2d"
version = "0.1.0"
description = "Physical 2D disk DEM hopper simulation with reproducible trajectories"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "requests>=2.31,<3",
  "h5py>=3.10,<4",
  "pillow>=10,<13",
]

[project.optional-dependencies]
acceleration = ["taichi==1.7.3"]
reference = ["numbers-parser==4.22.2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
