<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">PharmaFlow-2D research system architecture</title>
<desc id="desc">DEM simulation produces physical trajectories, which feed causal features and retrospective event labels. Grouped runs feed training. At runtime, current causal observations feed frozen physics-rule and machine-learning scores into a chronological monitor and dashboard. External data are audited separately and do not currently support calibration.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#475569"/></marker><marker id="futureArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#b45309"/></marker><style>
.title{font:700 26px Arial,sans-serif;fill:#0f172a}.section{font:700 16px Arial,sans-serif;fill:#334155;letter-spacing:.5px}.label{font:600 15px Arial,sans-serif;fill:#0f172a}.sub{font:12px Arial,sans-serif;fill:#334155}.sim{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.data{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.model{fill:#fef3c7;stroke:#d97706;stroke-width:2}.online{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.ext{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.link{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.future{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#futureArrow)}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}</style></defs>
<rect width="1500" height="900" fill="#f8fafc"/><text x="42" y="44" class="title">PharmaFlow-2D · research system architecture</text>
<rect x="30" y="68" width="1440" height="320" rx="18" class="panel"/><text x="54" y="100" class="section">SIMULATION, DATA CONSTRUCTION AND TRAINING</text>
<rect x="55" y="153" width="220" height="84" rx="12" class="sim"/><text x="165" y="185" text-anchor="middle" class="label">2D DEM solver</text><text x="165" y="209" text-anchor="middle" class="sub">NumPy CPU · optional Taichi</text>
<rect x="338" y="153" width="242" height="84" rx="12" class="sim"/><text x="459" y="185" text-anchor="middle" class="label">Physical trajectories</text><text x="459" y="209" text-anchor="middle" class="sub">position · velocity · spin · contact</text><path d="M275 195 H332" class="link"/>
<rect x="640" y="128" width="246" height="84" rx="12" class="data"/><text x="763" y="160" text-anchor="middle" class="label">Causal feature extraction</text><text x="763" y="184" text-anchor="middle" class="sub">current state + trailing windows</text><path d="M580 185 H634" class="link"/>
<rect x="640" y="264" width="246" height="84" rx="12" class="data"/><text x="763" y="296" text-anchor="middle" class="label">Retrospective event labels</text><text x="763" y="320" text-anchor="middle" class="sub">future-only confirmation · censoring</text><path d="M500 237 C530 290 575 306 634 306" class="future"/><text x="530" y="273" class="sub" fill="#92400e">future annotation</text>
<rect x="944" y="153" width="214" height="84" rx="12" class="data"/><text x="1051" y="185" text-anchor="middle" class="label">Grouped splits</text><text x="1051" y="209" text-anchor="middle" class="sub">whole runs / configurations</text><path d="M886 170 C912 170 915 183 938 187" class="link"/><path d="M886 306 C919 306 915 222 938 212" class="link"/>
<rect x="1214" y="137" width="224" height="74" rx="12" class="model"/><text x="1326" y="166" text-anchor="middle" class="label">Training only</text><text x="1326" y="190" text-anchor="middle" class="sub">fold-local transforms / weights</text><rect x="1214" y="238" width="224" height="74" rx="12" class="model"/><text x="1326" y="267" text-anchor="middle" class="label">Frozen model artifacts</text><text x="1326" y="291" text-anchor="middle" class="sub">research baseline, not a service</text><path d="M1158 195 H1208" class="link"/><path d="M1326 211 V232" class="link"/>
<rect x="30" y="411" width="1440" height="207" rx="18" class="panel"/><text x="54" y="443" class="section">CHRONOLOGICAL INFERENCE AND VISUALIZATION</text>
<rect x="55" y="488" width="218" height="78" rx="12" class="online"/><text x="164" y="519" text-anchor="middle" class="label">Current causal prefix</text><text x="164" y="543" text-anchor="middle" class="sub">only observations available by t</text><path d="M763 212 C763 420 165 404 165 482" class="link"/>
<rect x="347" y="467" width="212" height="66" rx="12" class="online"/><text x="453" y="494" text-anchor="middle" class="label">Physics-rule score</text><text x="453" y="516" text-anchor="middle" class="sub">frozen M4A policy</text><rect x="347" y="550" width="212" height="52" rx="12" class="online"/><text x="453" y="574" text-anchor="middle" class="label">Frozen ML score</text><text x="453" y="592" text-anchor="middle" class="sub">if local artifact exists</text><path d="M273 527 H341" class="link"/><path d="M1326 312 C1326 397 454 392 454 544" class="link"/>
<rect x="640" y="488" width="248" height="78" rx="12" class="online"/><text x="764" y="519" text-anchor="middle" class="label">Chronological monitor</text><text x="764" y="543" text-anchor="middle" class="sub">warning episodes · observed flow</text><path d="M559 500 C594 500 601 518 634 518" class="link"/><path d="M559 576 C598 576 600 540 634 540" class="link"/>
<rect x="970" y="488" width="208" height="78" rx="12" class="sim"/><text x="1074" y="519" text-anchor="middle" class="label">Trajectory viewer</text><text x="1074" y="543" text-anchor="middle" class="sub">stored frames · speed · contacts</text><path d="M459 237 C459 424 1074 408 1074 482" class="link"/>
<rect x="1250" y="488" width="188" height="78" rx="12" class="online"/><text x="1344" y="519" text-anchor="middle" class="label">Dashboard</text><text x="1344" y="543" text-anchor="middle" class="sub">time-aligned diagnostics</text><path d="M888 527 H1244" class="link"/><path d="M1178 527 H1244" class="link"/>
<rect x="30" y="641" width="1440" height="220" rx="18" class="panel"/><text x="54" y="673" class="section">SEPARATE EXTERNAL EXPERIMENT AUDIT · NOT A MODEL-FITTING PATH</text>
<rect x="77" y="720" width="240" height="78" rx="12" class="ext"/><text x="197" y="750" text-anchor="middle" class="label">External sources</text><text x="197" y="774" text-anchor="middle" class="sub">Cornerstones · Delft · Yogi</text><rect x="423" y="720" width="240" height="78" rx="12" class="ext"/><text x="543" y="750" text-anchor="middle" class="label">Provenance / schema audit</text><text x="543" y="774" text-anchor="middle" class="sub">units · geometry · observables</text><rect x="769" y="720" width="240" height="78" rx="12" class="ext"/><text x="889" y="750" text-anchor="middle" class="label">Compatibility gates</text><text x="889" y="774" text-anchor="middle" class="sub">unknown or unmatched fails</text><rect x="1115" y="720" width="260" height="78" rx="12" class="ext"/><text x="1245" y="750" text-anchor="middle" class="label">No quantitative calibration</text><text x="1245" y="774" text-anchor="middle" class="sub">qualitative / blocked comparisons</text><path d="M317 759 H417" class="link"/><path d="M663 759 H763" class="link"/><path d="M1009 759 H1109" class="link"/>
<text x="55" y="886" class="sub">Dashed amber link denotes future observations used only for retrospective outcome confirmation.</text></svg>