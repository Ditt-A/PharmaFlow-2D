<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="890" viewBox="0 0 1120 890"
  role="img" aria-labelledby="title desc">
  <title id="title">PharmaFlow-2D system architecture</title>
  <desc id="desc">The DEM solver provides trajectories for retrospective event labels,
    causal features, and frame replay. Labels and causal features feed grouped training.
    The frozen model and causal features feed ML scoring. Causal features also feed the
    physics rule. Both scores feed chronological monitoring, which the dashboard displays
    alongside stored frame replay. An independent audit assesses external data compatibility.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8"
      markerUnits="userSpaceOnUse" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
    <marker id="future-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8"
      markerUnits="userSpaceOnUse" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172b43; }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .name { font-size: 17px; font-weight: 650; text-anchor: middle; }
      .detail { font-size: 13px; fill: #475569; text-anchor: middle; }
      .panel { fill: #fff; stroke: #cbd5e1; }
      .simulation { fill: #e8f2ff; stroke: #3c75bc; }
      .training { fill: #eef7eb; stroke: #54814a; }
      .artifact { fill: #fff4dc; stroke: #ac731c; }
      .runtime { fill: #f1edff; stroke: #7866aa; }
      .external { fill: #f1f5f9; stroke: #64748b; }
      .wire { fill: none; stroke: #475569; stroke-width: 1.75; stroke-linejoin: round; }
      .arrow { marker-end: url(#arrow); }
      .future { stroke: #b45309; stroke-dasharray: 5 4; marker-end: url(#future-arrow); }
      .junction { fill: #475569; }
    </style>
  </defs>
  <rect width="1120" height="890" rx="16" fill="#f8fafc"/>
  <text x="25" y="42" class="title">PharmaFlow-2D system architecture</text>

  <rect x="24" y="260" width="353" height="488" rx="14" class="panel"/>
  <rect x="395" y="260" width="701" height="488" rx="14" class="panel"/>
  <rect x="24" y="765" width="1072" height="103" rx="14" class="panel"/>
  <text x="47" y="287" class="heading">RESEARCH DATA &amp; TRAINING</text>
  <text x="418" y="287" class="heading">INFERENCE &amp; REPLAY</text>
  <text x="47" y="793" class="heading">INDEPENDENT EXTERNAL DATA AUDIT</text>

  <!-- Shared simulation outputs -->
  <path d="M626 127 V151" class="wire arrow"/>
  <path d="M626 213 V306" class="wire arrow"/>
  <path d="M626 238 H329 V306" class="wire future"/>
  <path d="M626 238 H961 V306" class="wire arrow"/>
  <circle cx="626" cy="238" r="3.5" class="junction"/>

  <!-- Research dataset and frozen model handoff -->
  <path d="M200 366 V392" class="wire arrow"/>
  <path d="M474 336 H364 V420 H350" class="wire arrow"/>
  <path d="M200 448 V470" class="wire arrow"/>
  <path d="M200 522 V545" class="wire arrow"/>
  <path d="M350 575 H434" class="wire arrow"/>

  <!-- Current features feed both scores. The model enters only the ML scorer. -->
  <path d="M626 366 V471 H536 V545" class="wire arrow"/>
  <path d="M626 471 H808 V545" class="wire arrow"/>
  <circle cx="626" cy="471" r="3.5" class="junction"/>
  <path d="M536 605 V620 H672" class="wire"/>
  <path d="M808 605 V620 H672 V636" class="wire arrow"/>
  <circle cx="672" cy="620" r="3.5" class="junction"/>
  <path d="M672 686 V700" class="wire arrow"/>
  <path d="M961 366 V700" class="wire arrow"/>

  <!-- External data has no link to fit or inference. -->
  <path d="M258 831 H292" class="wire arrow"/>
  <path d="M518 831 H552" class="wire arrow"/>
  <path d="M778 831 H812" class="wire arrow"/>

  <g>
    <rect x="484" y="71" width="284" height="56" rx="9" class="simulation"/>
    <text x="626" y="95" class="name">2D DEM solver</text>
    <text x="626" y="114" class="detail">NumPy CPU · optional Taichi contacts</text>
    <rect x="484" y="151" width="284" height="62" rx="9" class="simulation"/>
    <text x="626" y="177" class="name">Stored DEM trajectories</text>
    <text x="626" y="197" class="detail">Particle states · time · outlet crossings</text>
  </g>

  <g>
    <rect x="50" y="306" width="300" height="60" rx="9" class="training"/>
    <text x="200" y="331" class="name">Retrospective event labels</text>
    <text x="200" y="351" class="detail">Future frames confirm arch events</text>
    <rect x="50" y="392" width="300" height="56" rx="9" class="training"/>
    <text x="200" y="416" class="name">Grouped dataset splits</text>
    <text x="200" y="435" class="detail">Whole runs or physical configurations</text>
    <rect x="50" y="470" width="300" height="52" rx="9" class="training"/>
    <text x="200" y="492" class="name">ML training</text>
    <text x="200" y="511" class="detail">Preprocessing and weights fit per fold</text>
    <rect x="50" y="545" width="300" height="60" rx="9" class="artifact"/>
    <text x="200" y="570" class="name">Frozen ML model</text>
    <text x="200" y="590" class="detail">Stored artifact from the training pipeline</text>
  </g>

  <g>
    <rect x="474" y="306" width="304" height="60" rx="9" class="runtime"/>
    <text x="626" y="331" class="name">Causal feature extraction</text>
    <text x="626" y="351" class="detail">Current state and trailing observations</text>
    <rect x="844" y="306" width="234" height="60" rx="9" class="simulation"/>
    <text x="961" y="331" class="name">Stored frame playback</text>
    <text x="961" y="351" class="detail">Positions · speeds · contacts</text>
    <rect x="434" y="545" width="204" height="60" rx="9" class="runtime"/>
    <text x="536" y="570" class="name">Frozen ML score</text>
    <text x="536" y="590" class="detail">Model or verified score cache</text>
    <rect x="706" y="545" width="204" height="60" rx="9" class="runtime"/>
    <text x="808" y="570" class="name">Physics rule score</text>
    <text x="808" y="590" class="detail">Fixed M4A rule</text>
    <rect x="506" y="636" width="332" height="50" rx="9" class="runtime"/>
    <text x="672" y="658" class="name">Chronological monitor</text>
    <text x="672" y="676" class="detail">Warning episodes and observed discharge</text>
    <rect x="506" y="700" width="572" height="37" rx="9" class="runtime"/>
    <text x="792" y="724" class="name">Interactive dashboard</text>
  </g>

  <g>
    <rect x="47" y="808" width="211" height="46" rx="9" class="external"/>
    <text x="152.5" y="828" class="name">Experimental sources</text>
    <text x="152.5" y="846" class="detail">Cornerstones · Delft · Yogi</text>
    <rect x="292" y="808" width="226" height="46" rx="9" class="external"/>
    <text x="405" y="828" class="name">Provenance review</text>
    <text x="405" y="846" class="detail">Access · schema · units</text>
    <rect x="552" y="808" width="226" height="46" rx="9" class="external"/>
    <text x="665" y="828" class="name">Compatibility checks</text>
    <text x="665" y="846" class="detail">Geometry · measured quantities</text>
    <rect x="812" y="808" width="266" height="46" rx="9" class="external"/>
    <text x="945" y="828" class="name">Qualitative comparison</text>
    <text x="945" y="846" class="detail">Quantitative calibration unresolved</text>
  </g>
</svg>
